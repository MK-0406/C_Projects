<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chinese Remainder Theorem Solver</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007BFF; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; min-height: 50px; font-size: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Chinese Remainder Theorem Solver</h2>
    <p>Enter your system variables below to process them with the C++ engine:</p>
    
    <h3>Remainders (a)</h3>
    <div class="row">
        <div class="input-group"><label>a1</label><input type="number" id="a1" value="4"></div>
        <div class="input-group"><label>a2</label><input type="number" id="a2" value="7"></div>
        <div class="input-group"><label>a3</label><input type="number" id="a3" value="8"></div>
    </div>

    <h3>Modulos (n)</h3>
    <div class="row">
        <div class="input-group"><label>n1</label><input type="number" id="n1" value="2"></div>
        <div class="input-group"><label>n2</label><input type="number" id="n2" value="5"></div>
        <div class="input-group"><label>n3</label><input type="number" id="n3" value="9"></div>
    </div>

    <button onclick="calculateCRT()">Solve Congruences</button>

    <h3>C++ Output Engine Terminal:</h3>
    <pre id="output">Click 'Solve Congruences' to see the calculated solution...</pre>
</div>

<script>
    async function calculateCRT() {
        const outputElement = document.getElementById('output');
        outputElement.innerText = "Processing engine parameters...";

        // Collect values from the HTML inputs
        const a1 = document.getElementById('a1').value;
        const a2 = document.getElementById('a2').value;
        const a3 = document.getElementById('a3').value;
        const n1 = document.getElementById('n1').value;
        const n2 = document.getElementById('n2').value;
        const n3 = document.getElementById('n3').value;

        try {
            // Build the URL link parameter query out to the running C++ executable application
            const url = `https://chinese-remainder-theorem.onrender.com/api/solve?a1=${a1}&a2=${a2}&a3=${a3}&n1=${n1}&n2=${n2}&n3=${n3}`;
            const response = await fetch(url);
            const textResult = await response.text();
            
            // Print the raw returned console buffer directly to the window screen
            outputElement.innerText = textResult;
        } catch (error) {
            outputElement.innerText = "Error: Unable to connect to your local C++ Server backend application. Check if it is running!";
        }
    }
</script>

</body>
</html>
